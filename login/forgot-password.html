<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofe — Відновлення пароля</title>
  <link rel="stylesheet" href="../../css/authstyle.css" />
</head>
<body>

  <header>
    <div class="logo">Cofe</div>

    <div class="translate-wrapper">
      <div class="lang-current" onclick="toggleLang()">UK</div>

      <div class="lang-dropdown" id="lang-dropdown">
        <a class="lang-item" onclick="changeLang('en')">English</a>
        <a class="lang-item" onclick="changeLang('ru')">Русский</a>
        <a class="lang-item" onclick="changeLang('uk')">Українська</a>
        <a class="lang-item" onclick="changeLang('de')">Deutsch</a>
      </div>
    </div>

    <button type="button" class="burger-btn" id="burger-btn" aria-label="Відкрити меню">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav>
      <a href="../index.html" data-i18n="nav_home">Головна</a>
      <a href="../index.html#team" data-i18n="nav_about">Про нас</a>
      <a href="../index.html#feedback-section" data-i18n="nav_reviews">Відгуки</a>
      <a href="../index.html#booking" data-i18n="nav_booking">Бронювання</a>
      <a href="../gallery.html" data-i18n="nav_gallery">Галерея</a>
      <a href="../menu.html" data-i18n="nav_menu">Меню</a>
      <a href="login/login.html" class="active"  data-i18n="login">Особистий кабінет</a>
    </nav>

    <button type="button" class="account-open-btn" data-account-open hidden>
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="tel:+380970111111" class="phone">+380 97 011 1111</a>
  </header>

<main class="auth-page">
  <section class="auth-card small">
    <div class="auth-header">
      <h1>Забули пароль?</h1>
      <p>Введіть email, і ми надішлемо посилання для відновлення</p>
    </div>

    <form class="auth-form active" id="forgot-form">
      <label>
        Email
        <input type="email" id="forgot-email" placeholder="your@email.com" required>
      </label>

      <button type="submit" class="auth-main-btn">Надіслати</button>

      <p id="forgot-message" class="auth-message"></p>

      <a href="login.html" class="auth-link">Повернутись до входу</a>
    </form>
  </section>
</main>

<script type="module" src="../../js/password/forgotPassword.js"></script>


<!--Логика бургер-меню -->
<script>
  const burgerBtn = document.getElementById("burger-btn");
  const nav = document.querySelector("header nav");

  if (burgerBtn && nav) {
    burgerBtn.addEventListener("click", () => {
      burgerBtn.classList.toggle("active");
      nav.classList.toggle("open");
    });
  }
</script>
</body>
</html>
